<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>Ring Tests</title>
		<style>
		body {
			font-family: Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center; /* FIXED: Centers content vertically if scaled down */
			background-color: #222;
			color: #eee;
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden; 
			position: fixed; 
			touch-action: none; 
			-webkit-overflow-scrolling: auto; 
		}

		h1 {
			color: #fff;
			margin: 10px 0;
			text-align: center;
		}

		/* FIXED: Create an isolated scaling wrapper wrapper around game interface objects */
		.game-scaler {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			transform-origin: center center; /* Shrinks cleanly from the center point */
			width: auto;
			height: auto;
		}

		.container {
			display: flex;
			gap: 20px; /* Reduced from 30px to conserve small layout parameters */
			align-items: center;
			justify-content: center;
			flex-direction: column;
			position: relative;
			touch-action: none; 
		}

		.hands-section {
			display: flex;
			gap: 10px;
		}

		/* Hand Canvas Area (Keeps your exact fixed dimensions intact) */
		.hand-wrapper {
			position: relative;
			width: 256px;	
			height: 256px;	
			border: 2px dashed #ccc;
			background-color: #555;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
		}

		.hand-image {
			width: 100%;
			height: 100%;
			display: block;
			user-select: none;
		}

		/* Ring Selector Palette */
		.ring-palette {
			display: flex;
			flex-direction: column;
			align-items: center; /* Center items within palette */
			gap: 10px;
			padding: 15px;
			background: #555;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			min-width: 150px;
		}

		.ring-palette h3 {
			margin: 0 0 5px 0;
			font-size: 16px;
		}

		.ring-options {
			display: flex;
			gap: 15px;
		}

		.ring-item 
		{
			width: 40px;
			height: 40px;
			cursor: grab;
			border-radius: 50%;
			background-color: #fff;
			transition: transform 0.2s;
			transition: background 0.5s;
		}
		.ring-item:active
		{ 
			cursor: grabbing;
		}
		.ring-item:hover
		{ 
			transform: scale(1.1); 
			background-color: #60f; 
		}

		.ring-wrapper {
			position: absolute;
			width: 40px;
			height: 20px; 
			overflow: hidden;
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		.clipped-ring {
			position: absolute;
			width: 40px;
			height: 40px;
			top: 0;
			left: 0;
		}
		
		img { user-select: none; }

		.area-highlight-overlay {
			border: 2px dashed #ff0000 !important;
			background-color: rgba(255, 0, 0, 0.15) !important;
			transition: background-color 0.05s ease, border-color 0.05s ease;
		}

		.area-highlight-overlay.is-hovered {
			border-color: #00ff00 !important;
			background-color: rgba(0, 255, 0, 0.3) !important;
		}
	</style>
</head>
<body>

<h1>Drag & Drop Tests</h1>
<p>Drag a ring and drop it onto any finger</p>

<div class="game-scaler" id="gameScaler">
	<div class="container">
		<div class="hands-section">
			<!-- Left Hand Container -->
			<div class="hand-wrapper" id="leftHandContainer">
				<img 
					src="assets/img/left_hand.png" 
					alt="Left Hand" 
					usemap="#left-hand-map" 
					class="hand-image" 
				/>

				<!-- HTML Image Map defining drop targets for Left Hand -->
				<map name="left-hand-map">
					<area shape="rect" coords="48,25,80,118" alt="Pinky Finger" data-finger="left-pinky" href="#" />
					<area shape="rect" coords="85,16,117,115" alt="Ring Finger" data-finger="left-ring" href="#" />
					<area shape="rect" coords="120,5,152,112" alt="Middle Finger" data-finger="left-middle" href="#" />
					<area shape="rect" coords="155,16,187,135" alt="Index Finger" data-finger="left-index" href="#" />
					<area shape="rect" coords="190,96,240,150" alt="Thumb Finger" data-finger="left-thumb" href="#" />
				</map>
			</div>

			<!-- Right Hand Container -->
			<div class="hand-wrapper" id="rightHandContainer">
				<img 
					src="assets/img/right_hand.png" 
					alt="Right Hand" 
					usemap="#right-hand-map" 
					class="hand-image" 
				/>

				<!-- HTML Image Map defining drop targets for Right Hand (Mirrored Coords) -->
				<map name="right-hand-map">
					<area shape="rect" coords="16,96,66,150" alt="Thumb Finger" data-finger="right-thumb" href="#" />
					<area shape="rect" coords="69,16,101,135" alt="Index Finger" data-finger="right-index" href="#" />
					<area shape="rect" coords="104,5,136,112" alt="Middle Finger" data-finger="right-middle" href="#" />
					<area shape="rect" coords="139,16,171,115" alt="Ring Finger" data-finger="right-ring" href="#" />
					<area shape="rect" coords="176,25,208,118" alt="Pinky Finger" data-finger="right-pinky" href="#" />
				</map>
			</div>
		</div>
		<br />
		<!-- Ring Palette -->
		<div class="ring-palette">
			<h3>Select a Ring:</h3>
			<div class="ring-options" id="ring-options">
				<!-- filled by itemData.json -->
			</div>
		</div>
	</div>
</div>

<script src="./js/map.js"></script>
</body>
</html>
