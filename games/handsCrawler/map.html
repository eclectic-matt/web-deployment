<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>Ring Tests</title>
	<link rel="stylesheet" href="./style/map.css" />
	<script src="./js/class/ItemScoring.js" defer></script>
	<script src="./js/class/RingMapUi.js" defer></script>
	<script src="./js/class/LayoutManager.js" defer></script>
	<script src="./js/class/Damage.js" defer></script>
	<script src="./js/map.js" defer></script>
</head>
<body>

<section id="sidePanel">
	<section id="scoringArea" class="scoring-area">
		<table class="scoreTable">
			<tr>
				<td class="scorePart" id="baseScore">0</td>
				<td class="equationPart">x</td>
				<td class="scorePart" id="powerScore">1</td>
				<td class="equationPart">=</td>
				<td class="scorePart" id="totalScore">0</td>
			</tr>
		</table>
	</section>
</section>

<div class="game-scaler" id="game-scaler">
	
		<!-- Hands Maps -->
		<div id="hands-section" class="hands-section">
				<!-- filled by itemData.json -->
		</div>
		
		<!-- Item Palette -->
		<div class="ring-palette">
			<h3>Select an item:</h3>
			<div class="ring-options" id="ring-options">
				<!-- filled by itemData.json -->
			</div>
		</div>
		
</div>

<div id="buttonRow">
	<button id="btnTestPhysicalAttack">Physical</button>
	<button id="btnTestMagicalAttack">Magical</button>
	<button id="btnClearHands">Empty Hands</button>
</div>
	
</body>
</html>
