<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>Ring Fitting - Interactive Hand Map</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			background-color: #f4f4f9;
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			
			/* Force everything to lock inside the active screen boundaries */
			overflow: hidden; 
			position: fixed; 
			
			/* Disable mobile-specific browser gestures */
			touch-action: none; 
			-webkit-overflow-scrolling: auto; 
		}

		h1 {
			color: #333;
		}

		.container {
			display: flex;
			gap: 30px;
			margin-top: 20px;
			align-items: flex-start;
			flex-wrap: wrap;
			justify-content: center;
			width: 100%;
			height: 100%;
			overflow: hidden;
			position: relative;
			
			/* Standard safety measure to prevent native scrolling mechanics */
			touch-action: none; 
		}

		.hands-section {
			display: flex;
			gap: 20px;
		}

		/* Hand Canvas Area */
		.hand-wrapper {
			position: relative;
			width: 256px;		/*IMPORTANT: Keep this size consistent with the hand image dimensions for proper alignment*/
			height: 256px;	/*IMPORTANT: Keep this size consistent with the hand image dimensions for proper alignment*/
			border: 2px dashed #ccc;
			background-color: #fff;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
		}

		.hand-image {
			width: 100%;
			height: 100%;
			display: block;
			user-select: none;
		}

		/* Ring Selector Palette */
		.ring-palette {
			display: flex;
			flex-direction: column;
			gap: 15px;
			padding: 20px;
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			min-width: 150px;
		}

		.ring-palette h3 {
			margin: 0 0 10px 0;
			font-size: 16px;
		}

		.ring-options {
			display: flex;
			gap: 15px;
		}

		.ring-item {
			width: 40px;
			height: 40px;
			cursor: grab;
			border-radius: 50%;
			background-color: #fff;
			transition: transform 0.2s;
			transition: background 0.5s;
		}

		.ring-item:active {
			cursor: grabbing;
		}

		.ring-item:hover {
			transform: scale(1.1);
			background-color: #ddd;
		}

		/* Wrapper that clips the bottom half of the ring */
		.ring-wrapper {
			position: absolute;
			width: 40px;
			height: 20px; /* Only shows top half */
			overflow: hidden;
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		/* The actual ring image inside the wrapper, shifted up */
		.clipped-ring 
		{
			position: absolute;
			width: 40px;
			height: 40px;
			top: 0;
			left: 0;
		}
		
		img 
		{
			user-select: none;
		}

		/* Default highlight layer */
		.area-highlight-overlay 
		{
			border: 2px dashed #ff0000 !important;
			background-color: rgba(255, 0, 0, 0.15) !important;
			transition: background-color 0.05s ease, border-color 0.05s ease;
		}

		/* Active calculated hovering layer state */
		.area-highlight-overlay.is-hovered 
		{
			border-color: #00ff00 !important;
			background-color: rgba(0, 255, 0, 0.3) !important;
		}
	</style>
</head>
<body>

<h1>Drag & Drop Tests</h1>
<p>Drag a ring and drop it onto any finger</p>

<div class="container">
	<div class="hands-section">
		<!-- Left Hand Container -->
		<div class="hand-wrapper" id="leftHandContainer">
			<img 
				src="assets/img/left_hand.png" 
				alt="Left Hand" 
				usemap="#left-hand-map" 
				class="hand-image" 
			/>

			<!-- HTML Image Map defining drop targets for Left Hand -->
			<map name="left-hand-map">
				<area shape="rect" coords="48,25,80,118" alt="Pinky Finger" data-finger="left-pinky" href="#" />
				<area shape="rect" coords="85,16,117,115" alt="Ring Finger" data-finger="left-ring" href="#" />
				<area shape="rect" coords="120,5,152,112" alt="Middle Finger" data-finger="left-middle" href="#" />
				<area shape="rect" coords="155,16,187,135" alt="Index Finger" data-finger="left-index" href="#" />
				<area shape="rect" coords="190,96,240,150" alt="Thumb Finger" data-finger="left-thumb" href="#" />
			</map>
		</div>

		<!-- Right Hand Container -->
		<div class="hand-wrapper" id="rightHandContainer">
			<img 
				src="assets/img/right_hand.png" 
				alt="Right Hand" 
				usemap="#right-hand-map" 
				class="hand-image" 
			/>

			<!-- HTML Image Map defining drop targets for Right Hand (Mirrored Coords) -->
			<map name="right-hand-map">
				<area shape="rect" coords="16,96,66,150" alt="Thumb Finger" data-finger="right-thumb" href="#" />
				<area shape="rect" coords="69,16,101,135" alt="Index Finger" data-finger="right-index" href="#" />
				<area shape="rect" coords="104,5,136,112" alt="Middle Finger" data-finger="right-middle" href="#" />
				<area shape="rect" coords="139,16,171,115" alt="Ring Finger" data-finger="right-ring" href="#" />
				<area shape="rect" coords="176,25,208,118" alt="Pinky Finger" data-finger="right-pinky" href="#" />
			</map>
		</div>
	</div>

	<!-- Ring Palette -->
	<div class="ring-palette">
		<h3>Select a Ring:</h3>
		<div class="ring-options">
			<img 
				src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' stroke='%23ffd700' stroke-width='12' fill='none'/><circle cx='50' cy='15' r='10' fill='%2300ffff'/></svg>" 
				class="ring-item" 
				draggable="true" 
				id="ring1" 
				alt="Diamond Gold Ring"
			/>
			<img 
				src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' stroke='%23c0c0c0' stroke-width='12' fill='none'/><polygon points='50,5 60,20 40,20' fill='%23ff0055'/></svg>" 
				class="ring-item" 
				draggable="true" 
				id="ring2" 
				alt="Ruby Silver Ring"
			/>
			<img 
				src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' stroke='%23b87333' stroke-width='10' fill='none'/></svg>" 
				class="ring-item" 
				draggable="true" 
				id="ring3" 
				alt="Band Ring"
			/>
		</div>
	</div>
</div>

<script>
	let draggedRingSrc = null;
	let isDragging = false;
	let dragVisualElement = null; // Track our visual feedback element globally

	document.querySelectorAll('.ring-item').forEach(ring => {

		//==================
		// DRAG START 
		//==================

		// --- DESKTOP LOGIC ---
		ring.addEventListener('dragstart', (e) => {
			const imgElement = e.currentTarget.tagName === 'IMG' 
				? e.currentTarget 
				: e.currentTarget.querySelector('img');

			if (imgElement) {
				isDragging = true;
				draggedRingSrc = imgElement.src;
				e.dataTransfer.setData('text/plain', imgElement.src);
				highlightDropAreas(true);
			}
		});

		// --- MOBILE FALLBACK INITIALIZATION ---
		ring.addEventListener('pointerdown', (e) => {
			const imgElement = e.currentTarget.tagName === 'IMG' 
				? e.currentTarget 
				: e.currentTarget.querySelector('img');

			if (imgElement) {
				isDragging = true;
				draggedRingSrc = imgElement.src;
				highlightDropAreas(true);

				// Capture pointer focus to ensure movement tracking continues if finger slips
				ring.setPointerCapture(e.pointerId);

				// Create the visual proxy element immediately on down action
				dragVisualElement = document.createElement('img');
				dragVisualElement.src = draggedRingSrc;
				dragVisualElement.style.position = 'fixed'; // Fixed positioning scales better across layouts
				dragVisualElement.style.width = `${imgElement.offsetWidth}px`;
				dragVisualElement.style.height = `${imgElement.offsetHeight}px`;
				dragVisualElement.style.pointerEvents = 'none'; // Critical: allows dropping beneath itself
				dragVisualElement.style.zIndex = '9999';
				updateVisualPosition(e.clientX, e.clientY);
				document.body.appendChild(dragVisualElement);
			}
		});

		//==================
		// DRAG END (DROP) 
		//==================

		// --- DESKTOP NATIVE CLEANUP ---
		ring.addEventListener('dragend', () => {
			isDragging = false;
			highlightDropAreas(false);
			
			// Clean up any proxy images abandoned by pointerdown
			if (dragVisualElement) {
				dragVisualElement.remove();
				dragVisualElement = null;
			}
		});

		// --- MOBILE RELEASE LOGIC ---
		ring.addEventListener('pointerup', (e) => {
			if (!isDragging) return;
			highlightDropAreas(false);
			isDragging = false;
			if(e.pointerId === undefined) 
			{
				dragVisualElement.remove();
				dragVisualElement = null;
				return;
			}
			ring.releasePointerCapture(e.pointerId);

			if (dragVisualElement) {
				dragVisualElement.remove();
				dragVisualElement = null;
			}

			// 1. Get the actual finger position relative to the screen viewport
			const fingerX = e.clientX;
			const fingerY = e.clientY;

			let targetArea = null;

			// 2. Loop through all your area nodes directly
			for (let area of document.querySelectorAll('area')) {
				// Find the interactive hand background map image linked to this area configuration
				const map = area.parentElement;
				const linkedImg = document.querySelector(`img[usemap="#${map.name}"]`);
				
				if (!linkedImg) continue;

				// Calculate the physical layout positioning dimensions of the image on the mobile screen
				const rect = linkedImg.getBoundingClientRect();
				
				// Convert the string array coordinates from your HTML into numbers
				const coords = area.coords.split(',').map(Number);

				// Check bounding overlap rules based on the shape profile type
				if (area.shape === 'rect' || !area.shape) {
					// Adjust calculations to map layout boundaries accurately
					const left = rect.left + coords[0];
					const top = rect.top + coords[1];
					const right = rect.left + coords[2];
					const bottom = rect.top + coords[3];

					if (fingerX >= left && fingerX <= right && fingerY >= top && fingerY <= bottom) {
						targetArea = area;
						break;
					}
				} 
				else if (area.shape === 'circle') {
					const centerX = rect.left + coords[0];
					const centerY = rect.top + coords[1];
					const radius = coords[2];

					// Use the Pythagorean theorem to calculate distance from the center point
					const distance = Math.sqrt(Math.pow(fingerX - centerX, 2) + Math.pow(fingerY - centerY, 2));
					if (distance <= radius) {
						targetArea = area;
						break;
					}
				}
			}
			
			// 3. Fire your drop engine directly if boundary intersections match
			if (targetArea) {
				executeDropLogic(targetArea);
			} else {
				console.log("Dropped outside a valid finger area slot");
			}
		});

		//==================
		// DRAG MOVE 
		//==================

		// --- DESKTOP EVENT ---
		ring.addEventListener('dragmove', (e) => {
			if (!isDragging || !dragVisualElement) return;
			updateVisualPosition(e.clientX, e.clientY);
			
			// Tracks hover positions on mobile layout views in real-time
			updateActiveHoverState(e.clientX, e.clientY);
		});

		// --- MOBILE EVENT TRACKING ---
		ring.addEventListener('pointermove', (e) => {
			if (!isDragging || !dragVisualElement) return;
			updateVisualPosition(e.clientX, e.clientY);
			
			// Tracks hover positions on mobile layout views in real-time
			updateActiveHoverState(e.clientX, e.clientY);
		});

		// Prevent context menu interactions blocking dragging
		ring.addEventListener('contextmenu', (e) => e.preventDefault());
	});

	// Helper function to lock visual proxy positioning onto cursor/finger coordinates
	function updateVisualPosition(clientX, clientY) {
		if (!dragVisualElement) return;
		dragVisualElement.style.left = `${clientX - dragVisualElement.offsetWidth / 2}px`;
		dragVisualElement.style.top = `${clientY - dragVisualElement.offsetHeight / 2}px`;
	}

	// --- DESKTOP STANDARD LISTENERS ---
	const areas = document.querySelectorAll('area');
	areas.forEach(area => {
		area.addEventListener('dragover', (e) => {
			e.preventDefault();
			// Tracks desktop native mouse hover positions across layers
			updateActiveHoverState(e.clientX, e.clientY);
		});
		area.addEventListener('drop', (e) => {
			e.preventDefault();
			if(!isDragging) return;
			isDragging = false;
			executeDropLogic(area);
		});
	});

	// --- CENTRALIZED ISOLATED PRODUCTION DROP LOGIC ---
	function executeDropLogic(area) 
	{
		highlightDropAreas(false);
		const coords = area.coords.split(',').map(Number);
		let centerX = (coords[0] + coords[2]) / 2;
		let centerY = (coords[1] + coords[3]) / 2;

		const fingerId = area.getAttribute('data-finger');

		const existingRing = document.getElementById(`placed-${fingerId}`);
		if (existingRing) {
			existingRing.remove();
		}

		const mapName = area.parentElement.getAttribute('name');
		const targetContainerId = mapName === 'left-hand-map' ? 'leftHandContainer' : 'rightHandContainer';
		const activeContainer = document.getElementById(targetContainerId);

		const wrapper = document.createElement('div');
		wrapper.classList.add('ring-wrapper');
		wrapper.id = `placed-${fingerId}`;
		
		let ringRotateAngle = '0deg';
		if (fingerId === "right-thumb") {
			ringRotateAngle = '-30deg';
			centerX += 6;
			centerY -= 10;
		} else if (fingerId === "left-thumb") {
			ringRotateAngle = '30deg';
			centerX -= 10;
			centerY += 6;
		}
		
		wrapper.style.rotate = ringRotateAngle;
		wrapper.style.left = `${centerX}px`;
		wrapper.style.top = `${centerY}px`;

		const ringImg = document.createElement('img');
		ringImg.src = draggedRingSrc;
		ringImg.classList.add('clipped-ring');

		wrapper.appendChild(ringImg);
		activeContainer.appendChild(wrapper);
	}

	function updateActiveHoverState(clientX, clientY) {
		// 1. Remove the hover state class from all active overlays first
		document.querySelectorAll('.area-highlight-overlay').forEach(box => box.classList.remove('is-hovered'));

		// 2. Scan boundaries to see if coords sit inside any finger zone
		for (let area of document.querySelectorAll('area')) {
			const map = area.parentElement;
			const linkedImg = document.querySelector(`img[usemap="#${map.name}"]`);
			if (!linkedImg) continue;

			const rect = linkedImg.getBoundingClientRect();
			const coords = area.coords.split(',').map(Number);
			let isInside = false;

			if (area.shape === 'circle') {
				const centerX = rect.left + coords[0];
				const centerY = rect.top + coords[1];
				const radius = coords[2];
				const distance = Math.sqrt(Math.pow(clientX - centerX, 2) + Math.pow(clientY - centerY, 2));
				if (distance <= radius) isInside = true;
			} 
			else if (area.shape === 'rect' || !area.shape) {
				const left = rect.left + coords[0];
				const top = rect.top + coords[1];
				const right = rect.left + coords[2];
				const bottom = rect.top + coords[3];
				if (clientX >= left && clientX <= right && clientY >= top && clientY <= bottom) isInside = true;
			}

			if (isInside) {
				// Find the matching visual overlay using the data index tracker attribute
				const index = area.getAttribute('data-area-index');
				const matchingOverlay = document.querySelector(`.area-highlight-overlay[data-area-index="${index}"]`);
				if (matchingOverlay) {
					matchingOverlay.classList.add('is-hovered');
				}
				break; // Stop evaluating once a match is found
			}
		}
	}

	function highlightDropAreas(showHighlight = false)
	{
		document.querySelectorAll('.area-highlight-overlay').forEach(box => box.remove());
		if (!showHighlight) return;

		document.querySelectorAll('area').forEach((area, index) => {
			const map = area.parentElement;
			const linkedImg = document.querySelector(`img[usemap="#${map.name}"]`);
			if (!linkedImg) return;

			const imgRect = linkedImg.getBoundingClientRect();
			const coords = area.coords.split(',').map(Number);

			const overlay = document.createElement('div');
			overlay.classList.add('area-highlight-overlay');
			
			// Link the overlay to this specific area slot
			overlay.setAttribute('data-area-index', index);
			area.setAttribute('data-area-index', index);

			overlay.style.position = 'fixed';
			overlay.style.pointerEvents = 'none'; 
			overlay.style.border = '2px dashed #ff0000';
			overlay.style.backgroundColor = 'rgba(255, 0, 0, 0.15)'; 
			overlay.style.borderRadius = '50%'; 
			overlay.style.zIndex = '999';

			if (area.shape === 'circle') {
				const radius = coords[2];
				const centerX = imgRect.left + coords[0];
				const centerY = imgRect.top + coords[1];
				overlay.style.width = `${radius * 2}px`;
				overlay.style.height = `${radius * 2}px`;
				overlay.style.left = `${centerX - radius}px`;
				overlay.style.top = `${centerY - radius}px`;
			}
			else if (area.shape === 'rect' || !area.shape) {
				overlay.style.borderRadius = '4px'; // Square style edges
				overlay.style.left = `${imgRect.left + coords[0]}px`;
				overlay.style.top = `${imgRect.top + coords[1]}px`;
				overlay.style.width = `${coords[2] - coords[0]}px`;
				overlay.style.height = `${coords[3] - coords[1]}px`;
			}

			document.body.appendChild(overlay);
		});
	}
</script>
</body>
</html>
