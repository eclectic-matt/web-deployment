<!DOCTYPE html>
<html>
	<head>
		<!-- Import classes -->
		<script src="./js/class/Damage.js" defer></script>
		<script src="./js/class/generators/ItemGenerator.js" defer></script>
		<script src="./js/generateUI.js" defer></script>
		<script src="./js/draggable.js" defer></script>
		<link href="./style/rings.css" rel="stylesheet"/>
		<link href="./style/layout.css" rel="stylesheet"/>
	</head>
	<body onload="initUI()">
		<main id="main">
			<section id="menuBar">
				<!-- TO DO -->
			</section>
			<section id="mainContent">
				<section id="sidePanel">
					<section id="scoringArea" class="scoring-area">
						<h2>Score:</h2>
						<span id="baseScore">10</span> x <span id="powerScore">1</span> = <span id="totalScore">0</span>
					</section>
				</section>
				<section id="gameArea">
					<h2>Hands:</h2>
					<div id="hands">
						<!-- Filled by JS -->
					</div>
					<br/>
					<h2>Equipment:</h2>
					<div id="draggable-pool">
						<!-- Filled by JS -->
					</div>
					<br/>
					<h2>Test:</h2>
					<div id="test">
						<textarea name="" id="txtTestOutput" cols="50" rows="10"></textarea>
						<button id="btnTestPhysicalAttack">Physical</button>
						<button id="btnTestMagicalAttack">Magical</button>
						<button id="btnClearTxt">Clear</button>
					</div>
				</section>
			</section>
		</main>
	</body>
</html>
