<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>Battle - DBL DGT</title>
	<link rel="stylesheet" href="./style/map.css" />
	<script src="./js/class/BattleManager.js" defer></script>
	<link rel="stylesheet" href="./style/battle.css" />
	<script>
	var btlMgr;
	var cts;
	
	const init = () => 
	{
		btlMgr = new BattleManager();
	}

	</script>
</head>

<body onload="init()">

<svg id="drag-line-svg" xmlns="http://w3.org">
	
	<defs>

	<marker 
			id="arrow-border" viewBox="0 0 10 10" 
			refX="5" refY="5" 
			markerWidth="2" markerHeight="2" 
			orient="auto-start-reverse">

			<path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
			
		</marker>
		
		<marker 
			id="arrow-tip" viewBox="0 0 10 10" 
			refX="6" refY="5" 
			markerWidth="2" markerHeight="2" 
			orient="auto-start-reverse">
			
			<path d="M 0 1 L 10 5 L 0 9 z" fill="#ffff22" />
			
		</marker>
		
	</defs>
	
	<g id="active-targeting-group">
		<path class="line-border" d="" />
		<path class="line-dash-color1" d="" />
		<path class="line-dash-color2" d="" />
	</g>

	<path id="active-drag-line" d="" />
</svg>

<!-- Filled in by LayoutManager.js -->
<section id="main">

</section>
</body>
</html>
