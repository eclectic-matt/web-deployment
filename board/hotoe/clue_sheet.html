<!DOCTYPE html>

	<title>Token Tracker Board</title>
	<link rel="stylesheet" href="style.css">
	<script>
	  const localStorageName = 'tokenTrackerState';
	  
		function init()
		{
			let savedState = JSON.parse(localStorage.getItem(localStorageName)) || {};
			if(savedState[0] !== undefined) 
			{
				savedState.forEach(item => {
					const checkbox = document.getElementById(item.id).querySelector('input[type="checkbox"]');
					if (checkbox) {
						checkbox.checked = item.checked;
					}
				});
			}
			//Add an event listener to each checkbox to save its state to localStorage when changed
			const checkboxes = document.querySelectorAll('input[type="checkbox"]');
			checkboxes.forEach(checkbox => {
				checkbox.addEventListener('change', () => {
					savedState = Array.from(checkboxes).map(cb => ({
						id: cb.parentElement.id,
						checked: cb.checked
					}));
					localStorage.setItem(localStorageName, JSON.stringify(savedState));
				});
			});
		}
		function reset()
		{
			//Reset localStorage data
			localStorage.setItem(localStorageName, JSON.stringify({}));
			//Uncheck all checkboxes
			const checkboxes = document.querySelectorAll('input[type="checkbox"]');
			checkboxes.forEach(checkbox => {
				checkbox.checked = false;
			});
		}
	</script>
</head>
