<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="./js/terrorscape.js" defer></script>
	<link rel="stylesheet" href="./style/terrorscape.css"></link>
</head>
<body onload="init()">
	<h1>Terrorscape Summary</h1>
	<section id="setup">
		<section id="map">
			<section id="choose-map">
				<h2>Choose a Map</h2>
				<select id="map-options" onchange="updateMap()"></select>
			</section>
			<section id="map-summary">
				<h2>Map Summary</h2>
			</section>
		</section>
		<section id="killer">
			<section id="choose-killer">
				<h2>Choose a Killer</h2>
				<select id="killer-options" onchange="updateKiller()"></select>
			</section>
			<section id="killer-summary">
				<h2>Killer Summary</h2>
			</section>
		</section>
		<section id="survivors">
			<section id="choose-survivors">
				<h2>Choose Survivors</h2>
				<select id="survivor-options" multiple onchange="updateSurvivors()"></select>
			</section>
			<section id="survivors-summary">
				<h2>Survivors Summary</h2>
			</section>
		</section>
		<section id="actions">
			<button id="reset-button" onclick="resetSelections()">Reset Selections</button>
			<button id="generate-button" onclick="generateSummary()">Generate Summary</button>
			<button id="generate-link-button" onclick="generateLink()">Generate Link</button>
			<p id="generated-link"></p>
		</section>
	</section>
</body>
</html>
